version: "3.8"

services:
  db:
    image: postgres:15
    container_name: ai_orc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_orc
    ports:
      - "5432:5432"
    volumes:
      - ai_orc_db_data:/var/lib/postgresql/data

volumes:
  ai_orc_db_data:
